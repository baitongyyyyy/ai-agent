services:
  backend:
    build: ./backend
    ports: ["5080:5080"]
    environment:
      LLM__BaseUrl: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM__Model: ${LLM_MODEL}
      LLM__ApiKey: ${LLM_API_KEY}
      Workspace__AccessToken: ${WORKSPACE_ACCESS_TOKEN}
      Workspace__AllowedOrigins: ${WORKSPACE_ALLOWED_ORIGINS:-http://localhost:5173}
      ConnectionStrings__Workspace: Data Source=/data/meow-office.db
    volumes: ["meow-data:/data"]
volumes:
  meow-data:
